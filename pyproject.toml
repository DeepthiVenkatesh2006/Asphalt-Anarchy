[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "asphalt-anarchy"
version = "0.1.0"
description = "PathSnap GPS Trajectory Map Matching by Asphalt-Anarchy"
readme = "Readme.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "pydantic>=2.6.0",
    "folium>=0.15.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "shapely>=2.0.0",
    "pyproj>=3.5.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0.1"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
